    .link:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.45)}
    .icon{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,0.03)}
    .label{flex:1;text-align:left}
    .small{font-size:13px;color:var(--muted)}
    .footer{margin-top:16px;font-size:12px;color:var(--muted)}
    .edit-note{background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;margin-top:12px;font-size:13px;color:var(--muted)}
    @media (max-width:420px){body{padding:18px}.card{padding:20px}}
